name: Github CI
on:
  # Executa o pipeline quando houver push ou pull request tendo como alvo a branch main
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  pipeline:
    runs-on: ubuntu-latest # Os comandos serão executados em um sistema operacional Linux

    steps:
      - name: Git Checkout
        uses: actions/checkout@v4 # Faz o checkout do código recebido

      - name: Set up JDK 8
        uses: actions/setup-java@v4 # Configura o Java 8
        with:
          distribution: temurin
          java-version: 8

      - name: Build
        run: mvn package -Dmaven.test.skip=true # Compila o código fonte

      - name: Unit Test
        run: mvn test # Executa os testes de unidade